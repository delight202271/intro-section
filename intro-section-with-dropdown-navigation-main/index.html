<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Intro section with dropdown navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<!-- section 1 -->
 
  
  <header>
      <!-- general for header  -->
     <div class="flex justify-between p-8 md:px-20 md:py-8 text-sm font-medium text-gray-700">
      <!-- Right -->
<div class="flex gap-10">
  <!-- logo  -->
<div>
  <img src="./images/logo.svg" alt="">
</div>
<!-- nav  -->

<p class="flex gap-1">
  Company <span class="h-1.5 relative top-2.5  gap-6"><img src="./images/icon-arrow-down.svg" alt=""></span>
</p>

<p>Careers</p>
<p>About</p>
  <!-- close for nav  -->
</div>
<!-- close for right -->
</div>

<!-- LEFT -->
<div class="hidden md:flex gap-4 items-center ">
<p>Login</p>
<button class="border border-gray-700 rounded-lg w-24 h-9 cursor-pointer">Register</button>
</div>

<!-- hamburger -->
<div class="block md:hidden">
  <img src="./images/icon-menu.svg" alt="">
</div>
      <!-- close of general  -->
     </div> 
    </header>
  <!-- section 2 -->

  <section class="max-w-7xl mx-auto px-6 pt-8 pb-16 md:px-8 md:pt-8 md:pb-24">
    <div class="flex flex-col items-center text-center gap-8 md:flex-row md:items-center md:text-left md:gap-12">


      <!-- text section -->
       <div class="order-2 lg:order-1 flex flex-col items-center md:items-start gap-6 md:w-5/12">
         <h1 class="text-4xl lg:text-6xl font-bold leading-tight tracking-tight text-gray-950" >Make remote work</h1>
         <p class="text-gray-600 text-base md:text-lg leading-relaxed max-w-sm">
        Get your team in sync, no matter your location.
        Streamline processes, create team rituals, and watch
        productivity soar.
      </p>
       <a heref="#" class="border border-gray-600 rounded-full px-8 py-3 font-medium text-gray-50 bg-gray-950 hover:bg-gray-50 hover:text-gray-950 ">Learn more</a>
       </div>
         <!-- image -->
          <div class="order-1 md:order-2 w-full md:w-7/12">
           <div class="relative w-full aspect-[4/3] md:aspect-[6/5]  overflow-hidden  flex items-center justify-center">
           <img
    src="./images/image-hero-mobile.png"
    alt=""class="md:hidden w-full h-full object-cover" >
            <img
    src="./images/image-hero-desktop.png"
    alt="" class="hidden md:block w-full h-full object-cover">
           </div>
          </div>
    </div>
      <!-- logos -->
    <div class="mt-12 flex items-center justify-between gap-6 w-[500px] ">
        <img src="./images/client-databiz.svg" alt="">
        <img src="./images/client-audiophile.svg" alt="">
        <img src="./images/client-meet.svg" alt="">
        <img src="./images/client-maker.svg" alt="">
      </div>
      
      

      

      

    </section>

  


  
</body>
</html>
